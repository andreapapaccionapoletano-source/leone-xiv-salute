name: Pubblica speciale Leone XIV su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara il sito statico
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          rsvg-convert --width 1200 --height 630 social-preview.svg --output _site/social-preview.png
          convert _site/social-preview.png -strip -interlace Plane -quality 88 _site/leone-xiv-social-v2.jpg
          test -s _site/leone-xiv-social-v2.jpg
          file _site/leone-xiv-social-v2.jpg
          identify -format 'Cover: %m %wx%h, %b\n' _site/leone-xiv-social-v2.jpg
          touch _site/.nojekyll

      - name: Salva la copertina nel repository per tutte le modalità di GitHub Pages
        run: |
          cp _site/leone-xiv-social-v2.jpg leone-xiv-social-v2.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leone-xiv-social-v2.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Salva copertina JPG per anteprime WhatsApp e X [skip ci]"
            git push origin HEAD:main
          else
            echo "Copertina JPG gia presente e aggiornata."
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Pubblica online
        id: deployment
        uses: actions/deploy-pages@v4
