name: Pubblica speciale Leone XIV su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara il sito statico
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert --width 1200 --height 630 social-preview.svg --output _site/social-preview.png
          touch _site/.nojekyll

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Pubblica online
        id: deployment
        uses: actions/deploy-pages@v4
