<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Leone XIV — Anatomia di una diagnosi</title>
<desc id="desc">Copertina editoriale del dossier interattivo sulla salute di Leone XIV, con illustrazione anatomica schematica dei polmoni.</desc>
<defs>
